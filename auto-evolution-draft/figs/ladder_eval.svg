<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1300" width="960" height="1300" role="img" aria-labelledby="t-ladder_eval">
<title id="t-ladder_eval">The evaluation ladder. Cheap signals first — a candidate only reaches expensive stages after surviving the cheap ones.</title>
<rect width="960" height="1300" fill="#FFFFFF"/>
<defs><marker id="a-6B7F96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F96"/></marker><marker id="a-A98F3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A98F3F"/></marker><marker id="a-2F6B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6B57"/></marker><marker id="a-1F3349" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3349"/></marker><marker id="a-5A9179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A9179"/></marker><marker id="a-7A6420" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7A6420"/></marker><marker id="a-C05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C05621"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F3349">The evaluation ladder</text>
<text x="480" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#A39B8D">CHEAP  →  EXPENSIVE</text>
<rect x="40" y="160" width="880" height="150" rx="12" fill="#E7F0EB" stroke="#E9E3D7" stroke-width="1.5" data-box="b1"/>
<text x="460" y="196" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b1" data-role="title">novelty gate</text>
<text x="460" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b1">docs: — · cost: free · labels: none</text>
<text x="460" y="254" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b1">skip duplicates · kill: cos &gt; 0.95 or boring vote</text>
<text x="460" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b1">feeds search: ✗ pre-eval only</text>
<rect x="40" y="325" width="880" height="150" rx="12" fill="#E9EEF3" stroke="#E9E3D7" stroke-width="1.5" data-box="b2"/>
<text x="460" y="361" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b2" data-role="title">smoke</text>
<text x="460" y="391" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b2">docs: 5 fixed · cost: free · labels: discovery</text>
<text x="460" y="419" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b2">fail-fast gate · kill: fail / timeout / canary hit</text>
<text x="460" y="447" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b2">feeds search: ✓ gates only</text>
<rect x="40" y="490" width="880" height="150" rx="12" fill="#E7F0EB" stroke="#E9E3D7" stroke-width="1.5" data-box="b3"/>
<text x="460" y="526" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b3" data-role="title">judge</text>
<text x="460" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b3">docs: ≤10 pairs · cost: ledger · labels: none (reads files)</text>
<text x="460" y="584" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b3">cheap ranking · kill: —</text>
<text x="460" y="612" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b3">feeds search: ✓ BT rank</text>
<rect x="40" y="655" width="880" height="150" rx="12" fill="#E9EEF3" stroke="#E9E3D7" stroke-width="1.5" data-box="b4"/>
<text x="460" y="691" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b4" data-role="title">proxy</text>
<text x="460" y="721" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b4">docs: ~12–20 · cost: ~$0.10 avg · labels: discovery</text>
<text x="460" y="749" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b4">search ranking · kill: stagnation / budget stop</text>
<text x="460" y="777" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b4">feeds search: ✓ 80% of evals</text>
<rect x="40" y="820" width="880" height="150" rx="12" fill="#E9EEF3" stroke="#E9E3D7" stroke-width="1.5" data-box="b5"/>
<text x="460" y="856" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b5" data-role="title">full discovery</text>
<text x="460" y="886" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b5">docs: ~60–100 · cost: per finalist · labels: discovery</text>
<text x="460" y="914" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b5">finalist selection · kill: —</text>
<text x="460" y="942" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b5">feeds search: ✓ finalist rank</text>
<rect x="40" y="985" width="880" height="150" rx="12" fill="#F7F0DF" stroke="#E9E3D7" stroke-width="1.5" data-box="b6"/>
<text x="460" y="1021" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b6" data-role="title">holdout</text>
<text x="460" y="1051" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b6">docs: ~30 · cost: ×1 per run · labels: sealed · never</text>
<text x="460" y="1079" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b6">promotion claim · kill: —</text>
<text x="460" y="1107" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b6">feeds search: ✗ final claim only</text>
<rect x="40" y="1160" width="880" height="110" rx="12" fill="#F4F6F8" stroke="#E9E3D7" stroke-width="1.5"/>
<text x="480" y="1202" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4A443C">≤250-eval budget → ≈80% proxy · ≈15% full discovery · holdout ×1</text>
<text x="480" y="1236" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368">holdout is a gated ceremony, not a budget line · judge cost per ledger</text>
</svg>
