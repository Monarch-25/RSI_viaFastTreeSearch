<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1680" width="960" height="1680" role="img" aria-labelledby="t-flow_gates">
<title id="t-flow_gates">Four gates, every one a real decision. The machine proposes at every stage; at four points a person can stop it.</title>
<rect width="960" height="1680" fill="#FFFFFF"/>
<defs><marker id="a-6B7F96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F96"/></marker><marker id="a-A98F3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A98F3F"/></marker><marker id="a-2F6B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6B57"/></marker><marker id="a-1F3349" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3349"/></marker><marker id="a-5A9179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A9179"/></marker><marker id="a-7A6420" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7A6420"/></marker><marker id="a-C05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C05621"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F3349">Four gates, every one a real decision</text>
<rect x="40" y="150" width="880" height="210" rx="14" fill="#F7F0DF" stroke="#7A6420" stroke-width="2.5" data-box="b1"/>
<text x="480" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b1" data-role="title">G1 · PM triage</text>
<text x="480" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368" data-in="b1">in: issue cards</text>
<text x="480" y="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b1">APPROVE_DEFECT</text>
<text x="480" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b1">PREFERENCE_IGNORE</text>
<text x="480" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b1">NEED_EVIDENCE</text>
<text x="480" y="350" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b1">+ rationale</text>
<rect x="40" y="420" width="880" height="210" rx="14" fill="#F7F0DF" stroke="#7A6420" stroke-width="2.5" data-box="b2"/>
<text x="480" y="462" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b2" data-role="title">G2 · Dev feasibility</text>
<text x="480" y="494" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368" data-in="b2">in: approved defects + code</text>
<text x="480" y="530" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b2">FEASIBLE</text>
<text x="480" y="560" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b2">INFEASIBLE {reason, effort, risk}</text>
<rect x="40" y="690" width="880" height="210" rx="14" fill="#F7F0DF" stroke="#7A6420" stroke-width="2.5" data-box="b3"/>
<text x="480" y="732" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b3" data-role="title">G3 · Owner: run?</text>
<text x="480" y="764" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368" data-in="b3">in: pathways + budget</text>
<text x="480" y="800" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b3">approve run · scope</text>
<text x="480" y="830" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b3">$ / eval caps</text>
<text x="480" y="860" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b3">→ run_id authorized</text>
<rect x="40" y="960" width="880" height="210" rx="14" fill="#F7F0DF" stroke="#7A6420" stroke-width="2.5" data-box="b4"/>
<text x="480" y="1002" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F3349" data-in="b4" data-role="title">G4 · Owner + PM: ship?</text>
<text x="480" y="1034" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368" data-in="b4">in: finalists + full + holdout</text>
<text x="480" y="1070" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b4">APPROVE → deploy tag</text>
<text x="480" y="1100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b4">ROLLBACK → parent</text>
<text x="480" y="1130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#5A4A14" data-in="b4">reason → archive</text>
<path d="M 480 350 L 480 420" fill="none" stroke="#7A6420" stroke-width="2.4" marker-end="url(#a-7A6420)"/>
<text x="480" y="385" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A6420">approved defects</text>
<path d="M 480 620 L 480 690" fill="none" stroke="#7A6420" stroke-width="2.4" marker-end="url(#a-7A6420)"/>
<text x="480" y="655" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A6420">feasible set</text>
<path d="M 480 890 L 480 960" fill="none" stroke="#7A6420" stroke-width="2.4" marker-end="url(#a-7A6420)"/>
<text x="480" y="925" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A6420">run authorized</text>
<rect x="40" y="1230" width="880" height="140" rx="14" fill="#FBEBDD" stroke="#C05621" stroke-width="2"/>
<text x="480" y="1270" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#C05621">PREFERENCE_IGNORE  →  do-not-optimize constraints  (from G1)</text>
<text x="480" y="1308" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#8A3B12">injected into mutation prompts  ·  enforced as Regress guards</text>
<text x="480" y="1342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368">the loop is told what NOT to chase — the second-most valuable output of triage</text>
<rect x="40" y="1410" width="880" height="140" rx="14" fill="#F4F6F8" stroke="#E9E3D7" stroke-width="1.5"/>
<text x="480" y="1450" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1F3349">every vote is timestamped, immutable, and carries its reason</text>
<text x="480" y="1488" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4A443C">only G4 is synchronous — G1–G3 run on queues so the search never waits</text>
<text x="480" y="1522" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368">a rollback reason re-enters the archive as a constraint on future mutations</text>
<text x="480" y="1600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#7A6420">G3 fires for every evolution run — there is no unattended budget</text>
<text x="480" y="1634" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#7A6420">G4 fires once per run, after the single permitted holdout evaluation</text>
</svg>
