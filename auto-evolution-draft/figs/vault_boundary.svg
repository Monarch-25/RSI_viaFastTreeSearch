<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1250" width="960" height="1250" role="img" aria-labelledby="t-vault_boundary">
<title id="t-vault_boundary">The Benchmark Vault is a boundary, not a database. The search may ask the vault for scores; it may never write, peek, or finalize on its own.</title>
<rect width="960" height="1250" fill="#FFFFFF"/>
<defs><marker id="a-6B7F96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F96"/></marker><marker id="a-A98F3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A98F3F"/></marker><marker id="a-2F6B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6B57"/></marker><marker id="a-1F3349" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3349"/></marker><marker id="a-5A9179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A9179"/></marker><marker id="a-7A6420" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7A6420"/></marker><marker id="a-C05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C05621"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F3349">The Benchmark Vault is a boundary, not a database</text>
<text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#A39B8D">OUTSIDE — the search</text>
<rect x="40" y="130" width="290" height="120" rx="14" fill="#F4F6F8" stroke="#3B4F66" stroke-width="2" data-box="b1"/>
<text x="185" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b1" data-role="title">coding agent (Copilot)</text>
<text x="185" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b1">authors ONE candidate patch</text>
<text x="185" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b1">from a sampled parent</text>
<rect x="335" y="130" width="290" height="120" rx="14" fill="#F4F6F8" stroke="#3B4F66" stroke-width="2" data-box="b2"/>
<text x="480" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b2" data-role="title">mutation model</text>
<text x="480" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b2">small refine · frontier shift</text>
<rect x="630" y="130" width="290" height="120" rx="14" fill="#F4F6F8" stroke="#3B4F66" stroke-width="2" data-box="b3"/>
<text x="775" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b3" data-role="title">evaluator farm</text>
<text x="775" y="192" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b3">builds image · runs docs</text>
<text x="775" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b3">in the sandbox</text>
<path d="M 480 250 L 480 300" fill="none" stroke="#2F6B57" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#a-2F6B57)"/>
<text x="390" y="278" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#2F6B57">POST /score</text>
<path d="M 620 300 L 680 252" fill="none" stroke="#2F6B57" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#a-2F6B57)"/>
<text x="775" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#2F6B57">score vector</text>
<rect x="40" y="300" width="880" height="680" rx="22" fill="#FBFAF7" stroke="#7A6420" stroke-width="4" stroke-dasharray="18 10"/>
<text x="480" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#7A6420">BENCHMARK VAULT — separate account · read-only mount</text>
<text x="480" y="370" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A6420">the agent cannot write · finalize is human-gated</text>
<rect x="60" y="380" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b4"/>
<text x="270" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b4" data-role="title">discovery set</text>
<text x="270" y="442" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b4">~60 labeled docs</text>
<rect x="480" y="380" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b5"/>
<text x="690" y="412" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b5" data-role="title">holdout set</text>
<text x="690" y="442" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b5">~30 docs · sealed</text>
<rect x="60" y="524" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b6"/>
<text x="270" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b6" data-role="title">frozen labels</text>
<text x="270" y="586" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b6">SHA-256 · bench_v7</text>
<rect x="480" y="524" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b7"/>
<text x="690" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b7" data-role="title">frozen scorer</text>
<text x="690" y="586" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b7">IoU ≥ 0.5 · S(c) weights</text>
<rect x="60" y="668" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b8"/>
<text x="270" y="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b8" data-role="title">canaries</text>
<text x="270" y="730" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b8">nonsense marks · sealed</text>
<rect x="480" y="668" width="420" height="124" rx="14" fill="#E9EEF3" stroke="#3B4F66" stroke-width="2" data-box="b9"/>
<text x="690" y="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b9" data-role="title">bench_ver pin</text>
<text x="690" y="730" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b9">docs + labels + scorer</text>
<rect x="60" y="832" width="840" height="110" rx="14" fill="#F7F0DF" stroke="#7A6420" stroke-width="2" data-box="b10"/>
<text x="480" y="864" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F3349" data-in="b10" data-role="title">POST /finalize</text>
<text x="480" y="894" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b10">human-gated · once per run</text>
<text x="480" y="920" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#4A443C" data-in="b10">promotion request only — a human stands on this line</text>
<rect x="40" y="1020" width="880" height="190" rx="16" fill="#FBEBDD" stroke="#C05621" stroke-width="2"/>
<text x="480" y="1062" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#C05621">FORBIDDEN — guardrail diff-scanner rejects the candidate, not just the request</text>
<text x="260" y="1105" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#8A3B12">✗ write benchmark files</text>
<text x="700" y="1105" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#8A3B12">✗ read holdout labels</text>
<text x="260" y="1145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#8A3B12">✗ modify the scorer</text>
<text x="700" y="1145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#8A3B12">✗ finalize without a human</text>
<text x="480" y="1188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#7A7368">canary hits block promotion when the candidate flags marks it never saw in discovery</text>
</svg>
